<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>諸神佛聖誕日｜隴善堂</title>
  <link rel="stylesheet" href="../styles.css">

  <style>
    .birthday-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .birthday-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .birthday-header h1 {
      margin-bottom: 12px;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .birthday-header p {
      opacity: .75;
      line-height: 1.8;
    }

    .birthday-list {
      display: grid;
      gap: 14px;
    }

    .birthday-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
      align-items: center;
      padding: 20px 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }

    .lunar-date {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .deity-name {
      line-height: 1.7;
      font-size: 1.08rem;
    }

    .birthday-note {
      margin-top: 32px;
      padding: 18px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      line-height: 1.8;
      opacity: .8;
    }

    .back-home {
      display: inline-block;
      margin-top: 36px;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .birthday-page {
        padding-top: 32px;
      }

      .birthday-item {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="birthday-page">

    <header class="birthday-header">
      <h1>隴善堂諸神佛聖誕日</h1>
      <p>恭錄本堂奉祀諸神佛聖誕日期<br>日期均以農曆為準</p>
    </header>

    <section class="birthday-list">

      <div class="birthday-item">
        <div class="lunar-date">正月初九日</div>
        <div class="deity-name">玉皇大天尊</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">二月初二日</div>
        <div class="deity-name">福德正神</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">二月十五日</div>
        <div class="deity-name">太上道祖</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">二月十九日</div>
        <div class="deity-name">觀音佛祖、如來佛祖</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">四月十八日</div>
        <div class="deity-name">碧霞元君、紫微大帝</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">四月廿五日</div>
        <div class="deity-name">二郎神君</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">四月廿六日</div>
        <div class="deity-name">李府千歲、飛虎將軍、虎爺公</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">四月廿七日</div>
        <div class="deity-name">范府千歲</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">五月初九日</div>
        <div class="deity-name">鳳陽老母</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">五月十八日</div>
        <div class="deity-name">張府天師</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">六月十八日</div>
        <div class="deity-name">池府千歲</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">六月廿四日</div>
        <div class="deity-name">關聖帝君</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">七月初七日</div>
        <div class="deity-name">註生娘娘</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">七月廿九日</div>
        <div class="deity-name">地藏王菩薩</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">九月初九日</div>
        <div class="deity-name">中壇元帥、太子元帥</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">九月十五日</div>
        <div class="deity-name">吳府千歲</div>
      </div>

      <div class="birthday-item">
        <div class="lunar-date">十月廿四日</div>
        <div class="deity-name">朱府千歲</div>
      </div>

    </section>

    <div class="birthday-note">
      ※ 本表依隴善堂奉祀諸神佛聖誕資料整理，日期均以農曆計。
    </div>

    <a class="back-home" href="../index.html">← 返回隴善堂首頁</a>

  </main>
</body>
